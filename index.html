<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lokhonia Engineering</title>

<style>

:root {
  --blue: #255083;
  --blue-dark: #1b3b61;
  --silver: #c7c9cc;
  --white: #ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Verdana, Geneva, sans-serif;
  background:white;
  line-height:1.6;
}

/* =========================
   HEADER
========================= */

header{
  background:var(--blue);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 8%;
}

.logo-container{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  height:60px;
  width:auto;
}

.logo-text{
  color:white;
  font-size:30px;
  font-weight:bold;
  letter-spacing:1px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:30px;
  font-weight:bold;
  font-size:15px;
  transition:0.3s;
}

nav a:hover{
  opacity:0.8;
}

/* =========================
   HERO SECTION
========================= */

.hero{
  position:relative;
  overflow:hidden;

  min-height:650px;

  background:linear-gradient(
      rgba(37,80,131,0.92),
      rgba(27,59,97,0.92)
    );

  display:flex;
  align-items:center;

  padding:100px 8%;
}

/* background photo */

.hero-image{
  position:absolute;
  top:0;
  right:0;

  width:50%;
  height:100%;

  opacity:0.18;

  z-index:1;
}

.hero-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* hero text */

.hero-content{
  position:relative;
  z-index:2;
  max-width:800px;
}

.hero h1{
  font-size:64px;
  line-height:1.1;
  color:white;
  margin-bottom:30px;

  text-shadow:
    2px 2px 8px rgba(0,0,0,0.4);
}

.hero p{
  font-size:24px;
  line-height:1.6;
  color:white;

  max-width:650px;

  margin-bottom:40px;
}

.button{
  display:inline-block;

  background:white;
  color:var(--blue);

  text-decoration:none;
  font-weight:bold;

  padding:16px 32px;

  border-radius:6px;

  transition:0.3s;
}

.button:hover{
  transform:translateY(-2px);
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  nav{
    margin-top:15px;
  }

  nav a{
    margin-left:0;
    margin-right:20px;
  }

  .hero{
    min-height:auto;
    padding:80px 8%;
  }

  .hero h1{
    font-size:42px;
  }

  .hero p{
    font-size:20px;
  }

  .hero-image{
    width:100%;
    opacity:0.12;
  }
}

</style>
</head>

<body>

<header>

  <div class="logo-container">

    <!-- Your logo file -->
    <img src="images/lokhonia-logo.png"
         alt="Lokhonia Engineering Logo"
         class="logo">

    <div class="logo-text">
      LOKHONIA ENGINEERING
    </div>

  </div>

  <nav>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Get in Touch</a>
  </nav>

</header>

<section class="hero">

  <div class="hero-image">
    <img src="images/hero-image.jpg"
         alt="Industrial Process Design">
  </div>

  <div class="hero-content">

    <h1>
      Process modeling and scale-up support for early-stage industrial startups.
    </h1>

    <p>
      Lokhonia Engineering helps startups visualize,
      model, and evaluate technologies at pilot and
      commercial scale.
    </p>

    <a class="button" href="#contact">
      Get in Touch
    </a>

  </div>

</section>

</body>
</html>
